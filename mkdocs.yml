# Site gerado por .github/workflows/pages.yml; .github/build_site.py prepara o _docs antes.
site_name: Refactoring Kit
site_description: "Os catálogos de refatoração de Fowler e Kerievsky e os 23 padrões do GoF como Agent Skills para Claude Code e Codex, com exemplos em C# 9."
site_url: https://gabrieldulolmarques.github.io/refactoring-kit/pt-br/
repo_url: https://github.com/gabrieldulolmarques/refactoring-kit
docs_dir: _docs
theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
extra:
  alternate:
    - name: Português (Brasil)
      link: /refactoring-kit/pt-br/
      lang: pt-BR
    - name: English
      link: /refactoring-kit/en/
      lang: en
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
